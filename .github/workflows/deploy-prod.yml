name: Migrate and Deploy to Cloudflare (Production)

on:
  push:
    branches:
      - production
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Required Secrets
        run: |
          PROD_DB_URL="${{ secrets.NEON_DATABASE_URL || secrets.NEON_DATABASE_URL_PROD }}"
          if [ -z "$PROD_DB_URL" ]; then
            echo "::error::Required secret NEON_DATABASE_URL (or NEON_DATABASE_URL_PROD) is not set or empty in GitHub Secrets!"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Required secret CLOUDFLARE_API_TOKEN is not set or empty in GitHub Secrets!"
            exit 1
          fi

      - name: Run database schema sync
        run: bun run db:push:prod --force
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.NEON_DATABASE_URL_PROD }}

      - name: Deploy to Cloudflare Workers
        run: bun run deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
