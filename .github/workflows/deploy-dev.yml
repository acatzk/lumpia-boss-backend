name: Migrate and Deploy to Cloudflare (Development)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Required Secrets
        run: |
          if [ -z "${{ secrets.NEON_DATABASE_URL_DEV }}" ]; then
            echo "::error::Required secret NEON_DATABASE_URL_DEV is not set or empty in GitHub Secrets!"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::Required secret CLOUDFLARE_API_TOKEN is not set or empty in GitHub Secrets!"
            exit 1
          fi

      - name: Run database schema sync
        run: bun run db:push:dev --force
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DEV }}

      - name: Deploy to Cloudflare Workers
        run: bun run deploy:dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
