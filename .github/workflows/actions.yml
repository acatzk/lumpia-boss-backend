name: Prebuild check

on:
  pull_request:
    branches:
      - develop
      - production
      - main

jobs:
  build-backend:
    name: Bun Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Linter and Prettier Checks
        run: |
          bun run lint
          bun run format:check
          bun x tsc --noEmit

      - name: Configure Test Environment
        run: |
          cat << 'EOF' > .dev.vars
          DATABASE_URL="${{ secrets.NEON_DATABASE_URL_DEV || secrets.NEON_DATABASE_URL }}"
          JWT_SECRET="${{ secrets.JWT_SECRET || 'test-jwt-access-secret-minimum-32-chars-key!' }}"
          JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET || 'test-jwt-refresh-secret-minimum-32-chars-key!' }}"
          ENVIRONMENT="development"
          RECAPTCHA_BYPASS_DEV="true"
          SWAGGER_USERNAME="admin"
          SWAGGER_PASSWORD="admin"
          EOF

      - name: Run Unit & Integration Tests
        run: bun run test --run
